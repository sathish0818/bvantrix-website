<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 124" fill="none" role="img" aria-label="BVANTRIX">
  <defs>
    <linearGradient id="bvxBlue" x1="18%" y1="2%" x2="86%" y2="78%">
      <stop offset="0%"   stop-color="#9CC6EC"/>
      <stop offset="38%"  stop-color="#4F8FC8"/>
      <stop offset="100%" stop-color="#0E2A47"/>
    </linearGradient>
    <linearGradient id="bvxBlueFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#EAF3FB"/>
      <stop offset="100%" stop-color="#7FAFDA"/>
    </linearGradient>
    <linearGradient id="bvxAmber" x1="4%" y1="96%" x2="84%" y2="10%">
      <stop offset="0%"   stop-color="#9A4C08"/>
      <stop offset="42%"  stop-color="#D4812C"/>
      <stop offset="100%" stop-color="#F0B46B"/>
    </linearGradient>
    <linearGradient id="bvxDark" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#2B3139"/>
      <stop offset="100%" stop-color="#101418"/>
    </linearGradient>
  </defs>

  <!-- stem -->
  <path d="M14 6 H32 V118 H14 Z" fill="url(#bvxDark)"/>

  <!-- upper bowl: the blue half, folded -->
  <path d="M32 6 A28 28 0 0 1 32 62 Z" fill="url(#bvxBlue)"/>
  <path d="M32 6 L60 34 L32 62 Z" fill="url(#bvxBlueFold)" opacity=".92"/>

  <!-- lower bowl: dark, lit from beneath -->
  <path d="M32 62 A30 30 0 0 1 32 122 Z" fill="url(#bvxDark)"/>
  <path d="M32 62 L62 92 L32 122 Z" fill="url(#bvxAmber)"/>
</svg>
