<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family:"Onest", system-ui, sans-serif;
    background:#08070F;
    color:#fff;
    position:relative;
  }
  /* violet light bleeding in from the right, behind everything */
  .wash {
    position:absolute; inset:0;
    background:
      radial-gradient(760px 700px at 78% 48%, rgba(124,77,236,.42), rgba(124,77,236,0) 62%),
      radial-gradient(900px 620px at 96% 96%, rgba(74,31,192,.34), rgba(74,31,192,0) 64%),
      radial-gradient(620px 520px at 6% 4%,  rgba(101,50,232,.16), rgba(101,50,232,0) 60%);
  }
  .grain {
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px);
    background-size:3px 3px;
  }
  .frame { position:relative; height:100%; padding:64px 72px; display:flex; flex-direction:column; }

  .brand { display:flex; align-items:center; gap:14px; }
  .brand svg { width:34px; height:34px; color:#fff; }
  .word { font-size:25px; font-weight:600; letter-spacing:.3em; }

  .mid { flex:1; display:flex; align-items:center; }
  h1 {
    font-size:74px; line-height:1.02; letter-spacing:-.036em; font-weight:600;
    max-width:660px;
  }
  h1 .dim { color:#A79BC8; }

  .foot { display:flex; align-items:center; justify-content:space-between; }
  .url { font-size:22px; font-weight:500; letter-spacing:-.01em; color:#fff; }
  .tag {
    font-size:14px; letter-spacing:.2em; text-transform:uppercase;
    color:#9A8FBC; font-weight:500;
  }

  .orb { position:absolute; right:-118px; top:50%; transform:translateY(-50%); width:660px; height:660px; }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="grain"></div>

  <svg class="orb" viewBox="0 0 400 400" fill="none">
    <defs>
      <radialGradient id="body" cx="37%" cy="29%" r="80%">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
        <stop offset="15%"  stop-color="#F2EDFE" stop-opacity=".99"/>
        <stop offset="39%"  stop-color="#CBB6F9" stop-opacity=".95"/>
        <stop offset="67%"  stop-color="#9A6CF2" stop-opacity=".88"/>
        <stop offset="88%"  stop-color="#7139E4" stop-opacity=".78"/>
        <stop offset="100%" stop-color="#5A26CE" stop-opacity=".5"/>
      </radialGradient>
      <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
        <stop offset="46%"  stop-color="#7C4DEC" stop-opacity="0"/>
        <stop offset="78%"  stop-color="#7C4DEC" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#7C4DEC" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="spec" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".92"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="rim" x1="20%" y1="10%" x2="85%" y2="95%">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="72%"  stop-color="#C9AEFB" stop-opacity="0"/>
        <stop offset="100%" stop-color="#E4D6FE" stop-opacity=".8"/>
      </linearGradient>
      <radialGradient id="signal" gradientUnits="userSpaceOnUse" cx="200" cy="200" r="186">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".95"/>
        <stop offset="52%"  stop-color="#C9AEFB" stop-opacity=".8"/>
        <stop offset="100%" stop-color="#9A6CF2" stop-opacity=".15"/>
      </radialGradient>
    </defs>

    <circle cx="200" cy="200" r="190" fill="url(#bloom)"/>
    <circle cx="200" cy="200" r="150" stroke="#8E76D6" stroke-width="1" stroke-opacity=".5"/>
    <circle cx="306" cy="94"  r="3.4" fill="#C9AEFB"/>

    <!-- signals arriving, frozen mid-flight -->
    <g stroke="url(#signal)" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M200 16 L200 63"   stroke-dasharray="13 100" pathLength="100" stroke-dashoffset="-22"/>
      <path d="M375 143 L331 157" stroke-dasharray="13 100" pathLength="100" stroke-dashoffset="-46"/>
      <path d="M308 348 L281 312" stroke-dasharray="13 100" pathLength="100" stroke-dashoffset="-8"/>
      <path d="M92 348 L119 312"  stroke-dasharray="13 100" pathLength="100" stroke-dashoffset="-62"/>
      <path d="M25 143 L69 157"   stroke-dasharray="13 100" pathLength="100" stroke-dashoffset="-34"/>
    </g>

    <circle cx="200" cy="200" r="134" fill="url(#body)"/>
    <circle cx="200" cy="200" r="134" fill="url(#rim)"/>
    <ellipse cx="160" cy="146" rx="44" ry="31" fill="url(#spec)" transform="rotate(-24 160 146)"/>

    <circle cx="200" cy="200" r="88" stroke="#FFFFFF" stroke-width="1" stroke-opacity=".5"/>
    <circle cx="200" cy="112" r="2.8" fill="#FFFFFF" fill-opacity=".92"/>
    <circle cx="262" cy="262" r="2.3" fill="#FFFFFF" fill-opacity=".68"/>
  </svg>

  <div class="frame">
    <div class="brand">
      <svg viewBox="0 0 28 28" aria-hidden="true">
        <path d="M2 5 L15 14 M2 10 L15 14 M2 18 L15 14 M2 23 L15 14"
              stroke="currentColor" stroke-width="1.5" fill="none" opacity=".55" stroke-linecap="round"/>
        <circle cx="20" cy="14" r="4.6" fill="currentColor"/>
      </svg>
      <span class="word">BVANTRIX</span>
    </div>

    <div class="mid">
      <h1>Decisions for a<br>more <span class="dim">human tomorrow.</span></h1>
    </div>

    <div class="foot">
      <span class="url">www.bvantrix.com</span>
    </div>
  </div>
</body>
</html>
